name: Sync to Hugging Face Space
on:
  push:
    branches: [main, claude/web-app-continue-6807bw]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_USER" && test -n "$HF_SPACE" || { echo "Thiếu secret HF_TOKEN / HF_USER / HF_SPACE"; exit 1; }
          git push --force "https://$HF_USER:$HF_TOKEN@huggingface.co/spaces/$HF_USER/$HF_SPACE" HEAD:main
